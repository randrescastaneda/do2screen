name: Build and deploy Quarto site

on:
  push:
    branches:
      - master
    paths:
      - "docs/site/**"
      - ".github/workflows/quarto-site.yml"
  # Allow manual runs from the Actions tab — useful for testing
  workflow_dispatch:

# Required permissions for GitHub Pages deployment via actions/deploy-pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment runs at a time; do not cancel in-progress runs
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Render site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@10ecffe43941bc1d1ea080631818c4aa70ee0435 # main 2025-12-12
        with:
          version: "release"

      - name: Render Quarto site
        uses: quarto-dev/quarto-actions/render@10ecffe43941bc1d1ea080631818c4aa70ee0435 # main 2025-12-12
        with:
          path: docs/site

      # Rendered output lands in docs/site/_site/ (Quarto default)
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs/site/_site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
